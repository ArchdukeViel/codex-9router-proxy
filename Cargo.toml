[package]
name = "codex-9router-proxy"
version = "0.2.1"
edition = "2021"
authors = ["ArchdukeViel"]
description = "High-performance transparent proxy bridge hooking OpenAI Codex Desktop & CLI to route subagents natively to 9Router or custom LLM endpoints."
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
