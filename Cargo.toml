[package]
name = "codex-9router-proxy"
version = "0.2.2"
edition = "2021"
authors = ["ArchdukeViel"]
description = "High-performance transparent proxy bridge hooking OpenAI Codex Desktop & CLI to route subagents natively to 9Router or custom LLM endpoints."
license = "MIT"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "stream", "json"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.5"
tower = "0.5.3"
zstd = "0.14.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
